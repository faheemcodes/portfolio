<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="faheem.devlabs | Faheem Ahmed Soomro — Final-Year Software Engineering Student at University of Sindh, Jamshoro. Focused on Custom PHP MVC, MySQL Relational Schemas, REST APIs, and Responsive UI/UX."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/images/cinematic.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Six+Caps&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var stored = window.localStorage.getItem("faheem-portfolio-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          } else {
            var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            document.documentElement.setAttribute("data-theme", prefersLight ? "light" : "dark");
          }
        } catch (e) {}
      })();
    </script>
    <title>faheem.devlabs | Faheem Ahmed Soomro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
